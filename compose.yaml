# Visual regression runs here and nowhere else, so that a screenshot baseline
# means "this is what the component looks like" rather than "this is what the
# component looks like on the machine that happened to record it".
services:
  visual:
    build:
      context: .
      dockerfile: Dockerfile
    # Empty means the host's own architecture, so `pnpm test:visual` works out
    # of the box everywhere. There is one baseline per case regardless of
    # architecture -- see the comparator notes in vitest.config.ts.
    #
    # Set VISUAL_PLATFORM=linux/amd64 to reproduce CI exactly, which is what
    # the workflows do. On Apple Silicon that needs Rosetta
    # (`colima start --vm-type=vz --vz-rosetta`); under QEMU emulation Node
    # aborts inside libuv with exit 134 before a single test runs.
    platform: ${VISUAL_PLATFORM:-}
    working_dir: /app
    # Chromium's default 64MB /dev/shm is not enough for a real page; without
    # this the browser dies mid-run with an opaque crash.
    shm_size: 1gb
    # Reaps zombie Chromium processes. Without an init, a killed run can leave
    # the container hanging.
    init: true
    volumes:
      - .:/app
      # Host node_modules is darwin-arm64. oxlint, rolldown and esbuild all ship
      # native binaries, so the container must never see them -- this named
      # volume masks the bind mount with a linux/amd64 install.
      - visual-node-modules:/app/node_modules
      # Survives `--build`, so reinstalls are near-instant.
      - visual-pnpm-store:/pnpm/store
      # The bind mount above is read-write and this container runs as root, so
      # without these the visual suite could write the host's git directory and
      # hooks -- and a hook planted from in here would then run on the host at
      # the next commit. Nothing in a screenshot run needs either, so mask them
      # with empty anonymous volumes.
      - /app/.git
      - /app/.husky

volumes:
  visual-node-modules:
  visual-pnpm-store:
